<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>zangetsu.space</title>
   <meta name="description" content="zangetsu.space — social links">
   <meta name="color-scheme" content="dark">

   <style>
      :root {
         --ink: #ffffff;
         --gold: #ffffff;
         --gold-soft: rgba(255, 255, 255, 0.4);
         --glass-tint: rgba(255, 255, 255, 0.08);
         --glass-tint-strong: rgba(255, 255, 255, 0.14);
         --glass-border: rgba(255, 255, 255, 0.14);
         --font-sf-pro: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, system-ui, sans-serif;
         --font-sf-compact: -apple-system, "SF Compact Text", "SF Compact Display", BlinkMacSystemFont, system-ui, sans-serif;
         --font-sf-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, monospace;
      }

      * {
         box-sizing: border-box;
      }

      .bg-video {
         position: fixed;
         inset: 0;
         width: 100%;
         height: 100%;
         object-fit: cover;
         filter: blur(12px);
         transform: scale(1.1);
         z-index: -2;
      }

      .bg-scrim {
         position: fixed;
         inset: 0;
         z-index: -1;
         background:
            radial-gradient(110% 75% at 50% 50%, transparent 25%, rgba(0, 0, 0, 0.92) 100%),
            linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.35) 45%, rgba(0, 0, 0, 0.7) 100%);
      }

      html,
      body {
         margin: 0;
         padding: 0;
         min-height: 100%;
      }

      body {
         font: 100%/1.5 var(--font-sf-pro);
         color: var(--ink);
         background-color: #000000;
         min-height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 3rem 1.5rem;
         overflow-x: hidden;
         position: relative;
      }

      .page {
         width: 100%;
         max-width: 56rem;
         display: flex;
         flex-direction: column;
         align-items: center;
         text-align: center;
         gap: 1.75rem;
      }

      .title {
         margin: 0;
         padding-bottom: 0.15em;
         font-family: var(--font-sf-pro);
         font-weight: 700;
         font-size: clamp(3.5rem, 10vw, 6.5rem);
         line-height: 1.2;
         letter-spacing: -0.02em;
         background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 55%, #bdbdbd 100%);
         -webkit-background-clip: text;
         background-clip: text;
         color: transparent;
      }

      .subtitle {
         margin: 0;
         max-width: 32rem;
         font-family: var(--font-sf-pro);
         font-style: italic;
         font-weight: 400;
         font-size: clamp(0.77rem, 1.68vw, 0.9625rem);
         line-height: 1.6;
         letter-spacing: 0.01em;
         color: var(--ink);
         text-shadow: 0 0 14px var(--gold-soft), 0 0 34px rgba(255, 255, 255, 0.18);
      }

      .links {
         list-style: none;
         margin: 0.75rem 0 0;
         padding: 0 0 0.5rem;
         display: flex;
         flex-wrap: nowrap;
         align-items: center;
         justify-content: flex-start;
         gap: 0.625rem;
         max-width: 100%;
         overflow-x: auto;
         -webkit-overflow-scrolling: touch;
      }

      /* ---- Liquid glass buttons: refract / tint / specular / content ---- */

      .glass-btn {
         position: relative;
         isolation: isolate;
         display: inline-flex;
         align-items: center;
         justify-content: center;
         flex-shrink: 0;
         min-width: 6rem;
         padding: 0.7rem 1.1rem;
         border-radius: 999px;
         overflow: hidden;
         text-decoration: none;
         color: var(--ink);
         font-family: var(--font-sf-compact);
         font-size: 0.875rem;
         font-weight: 500;
         letter-spacing: 0.01em;
         transform: translateZ(0);
         transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
         will-change: transform;
      }

      .glass-btn__refract {
         position: absolute;
         inset: 0;
         backdrop-filter: blur(14px) saturate(160%);
         backdrop-filter: blur(14px) url(#liquid-glass) saturate(160%);
         -webkit-backdrop-filter: blur(14px) saturate(160%);
      }

      .glass-btn__tint {
         position: absolute;
         inset: 0;
         background: var(--glass-tint);
         border: 1px solid var(--glass-border);
         border-radius: inherit;
      }

      .glass-btn__specular {
         position: absolute;
         inset: 0;
         border-radius: inherit;
         box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.35),
            inset 0 -1px 0 rgba(255, 255, 255, 0.06),
            0 0.5rem 1.5rem rgba(0, 0, 0, 0.35);
         pointer-events: none;
      }

      .glass-btn__glow {
         position: absolute;
         inset: 0;
         border-radius: inherit;
         background: radial-gradient(120% 140% at 50% 0%, rgba(255, 255, 255, 0.28), transparent 70%);
         opacity: 0;
         transition: opacity 0.3s ease;
         pointer-events: none;
      }

      .glass-btn__label {
         position: relative;
         z-index: 1;
      }

      .glass-btn:hover {
         transform: translateY(-0.125rem) scale(1.02);
      }

      .glass-btn:hover .glass-btn__glow {
         opacity: 1;
      }

      .glass-btn:hover .glass-btn__tint {
         background: var(--glass-tint-strong);
      }

      .glass-btn:active {
         transform: translateY(0) scale(0.965);
         transition: transform 0.15s cubic-bezier(0.32, 0.72, 0, 1);
      }

      .site-footer {
         position: fixed;
         left: 0;
         right: 0;
         bottom: 1.5rem;
         margin: 0;
         text-align: center;
         font-family: var(--font-sf-mono);
         font-size: 0.75rem;
         letter-spacing: 0.05em;
         color: rgba(255, 255, 255, 0.4);
      }

      /* ---- Accessibility & graceful degradation ---- */

      @media (prefers-reduced-motion: reduce) {

         *,
         *::before,
         *::after {
            transition-duration: 0.01ms !important;
         }

         .glass-btn:hover,
         .glass-btn:active {
            transform: none !important;
         }
      }

      @media (prefers-reduced-transparency: reduce) {
         .glass-btn__refract {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
         }

         .glass-btn__tint {
            background: #1a1a1a;
         }
      }

      @media (prefers-contrast: more) {
         .glass-btn__tint {
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.6);
         }
      }

      @media (max-width: 30rem) {
         .links {
            gap: 0.5rem;
            justify-content: flex-start;
            padding-left: 0.25rem;
            padding-right: 0.25rem;
            mask-image: linear-gradient(90deg, transparent 0, black 1.25rem, black calc(100% - 1.25rem), transparent 100%);
         }

         .glass-btn {
            min-width: auto;
            padding: 0.6rem 0.85rem;
            font-size: 0.8125rem;
         }
      }
   </style>
</head>

<body>

   <video class="bg-video" autoplay loop muted playsinline preload="auto">
      <source src="Silver.mp4" type="video/mp4">
   </video>
   <div class="bg-scrim"></div>

   <!-- Hidden SVG filter: gentle refraction for the glass buttons (Chromium only, ignored elsewhere) -->
   <svg width="0" height="0" style="position:absolute; overflow:hidden;">
      <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
         <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="7" result="noise" />
         <feGaussianBlur in="noise" stdDeviation="2.5" result="softNoise" />
         <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="16" xChannelSelector="R"
            yChannelSelector="G" />
      </filter>
   </svg>

   <main class="page">

               rel="noopener noreferrer">
               <span class="glass-btn__refract"></span>
               <span class="glass-btn__tint"></span>
               <span class="glass-btn__specular"></span>
               <span class="glass-btn__glow"></span>
               <span class="glass-btn__label">YouTube</span>
            </a></li>
         <li><a class="glass-btn" href="https://discord.com/invite/GbG78USkcP" target="_blank" rel="noopener noreferrer">
               <span class="glass-btn__refract"></span>
               <span class="glass-btn__tint"></span>
               <span class="glass-btn__specular"></span>
               <span class="glass-btn__glow"></span>
               <span class="glass-btn__label">Discord</span>
            </a></li>
         <li><a class="glass-btn" href="https://www.instagram.com/zangetsu.space" target="_blank"
               rel="noopener noreferrer">
               <span class="glass-btn__refract"></span>
               <span class="glass-btn__tint"></span>
               <span class="glass-btn__specular"></span>
               <span class="glass-btn__glow"></span>

            </a></li>
         <li><a class="glass-btn" href="https://www.tiktok.com/@zangetsu.space" target="_blank"

               <span class="glass-btn__specular"></span>
               <span class="glass-btn__glow"></span>

            </a></li>
         <li><a class="glass-btn" href="https://twitter.com/zangetsu_space" target="_blank" rel="noopener noreferrer">
               <span class="glass-btn__refract"></span>
               <span class="glass-btn__tint"></span>

         <li><a class="glass-btn" href="mailto:typezangetsu@gmail.com">
               <span class="glass-btn__refract"></span>

      </ul>

      <p class="site-footer">zangetsu.space</p>
   </main>

   <script>
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
         var bgVideo = document.querySelector('.bg-video');
         if (bgVideo) bgVideo.pause();
      }
   </script>

</body>

</html>
